[pytest]
# 将 rootdir 固定到 dwarf_scrolls/。pythonpath = . 指向 dwarf_scrolls 的父目录
# （如 D:\allin），使 `dwarf_scrolls` 作为顶层包被导入。引擎 allin_engine 已物理
# 内联于 dwarf_scrolls/allin_engine/，由 conftest.py 调用 engine_bootstrap 把
# dwarf_scrolls 注入 sys.path 最前，确保 import allin_engine 解析到项目内部副本
# （无项目外依赖）。
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 把项目根目录 (dwarf_scrolls 的父目录) 加入 pythonpath，使 `dwarf_scrolls` 作为
# 顶层包被导入；tests/ 无 __init__.py，pytest 以 tests/ 为 basedir 导入测试模块为
# 顶层 `test_*` 而非 `dwarf_scrolls.tests.*`，从而正确解析包结构。
pythonpath = .
