[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dwarf_scrolls"
version = "1.0.0"
description = "Dwarf Scrolls — 以矮人要塞 Legends Mode 阅读器形态呈现上古卷轴 kalpic 编年史"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "全哥"}
]
keywords = ["elder-scrolls", "dwarf-fortress", "legends-mode", "history-reader", "procedural-generation", "python"]

# ---- 核心依赖 (无) ----
# 引擎核心零硬依赖，所有外部库均为可选
dependencies = []

# ---- 可选依赖组 ----
[project.optional-dependencies]
# 渲染增强：公式引擎(asteval) + 数学加速(numpy)
render = [
    "numpy>=1.24",
    "asteval>=0.9",
]

# 音频合成：波形生成 + 信号处理 + 播放
audio = [
    "numpy>=1.24",
    "scipy>=1.10",
]

# pygame 完整功能（含音频播放 + 输入 + 字体渲染）
pygame = [
    "pygame-ce>=2.4",
]

# AI 内容生成：本地 ollama 或云端 DeepSeek
ai = [
    "requests>=2.28",
]

# 一键安装所有可选依赖
all = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pygame-ce>=2.4",
    "requests>=2.28",
    "asteval>=0.9",
]

[project.urls]
Homepage = "https://github.com/quan/dwarf_scrolls"
Issues = "https://github.com/quan/dwarf_scrolls/issues"

[project.scripts]
dwarf-scrolls = "dwarf_scrolls.main:main"
# 注：引擎内置测试套件无独立控制台脚本（run_all.py 内部以顶层
# `import alloy` 方式加载，依赖 dwarf_scrolls 目录在 sys.path 上，
# 仅脚本形式 `python alloy/test/run_all.py` 或 pytest 能稳定触发）。
# 运行方式见 README「测试」一节。

[tool.setuptools.packages.find]
include = ["dwarf_scrolls*"]

# 随包分发的本地字体（引擎地基 fonts/ 目录下的字体文件）
[tool.setuptools.package-data]
dwarf_scrolls = ["alloy/fonts/*"]

# ── mypy 类型检查 ──
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
exclude = ["alloy/.*"]

[[tool.mypy.overrides]]
module = [
    "dwarf_scrolls.core.*",
    "dwarf_scrolls.game.play_data",
    "dwarf_scrolls.game.play_components",
    "dwarf_scrolls.game.play_systems",
    "dwarf_scrolls.game.play_engine",
    "dwarf_scrolls.game.play_ui",
]
disallow_untyped_defs = true
